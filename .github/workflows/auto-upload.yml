name: Social Media Auto-Poster
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Restore State Cache
        uses: actions/cache/restore@v4
        with:
          path: src/state/
          key: autoposter-state-
          restore-keys: autoposter-state-

      - name: Run Auto Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTA_DM_USERNAME: ${{ secrets.INSTA_DM_USERNAME }}
          INSTA_DM_PASSWORD: ${{ secrets.INSTA_DM_PASSWORD }}
          INSTA_MAIN_USERNAME: ${{ secrets.INSTA_MAIN_USERNAME }}
        run: |
          mkdir -p src/state
          cd src && python main.py

      - name: Save State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: src/state/
          key: autoposter-state-${{ github.run_id }}

